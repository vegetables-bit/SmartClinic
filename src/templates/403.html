{% extends "clinic/auth/base.html" %}
{% block title %}Access denied | Smart Clinic{% endblock %}
{% block content %}
<section class="panel">
    <h1>Access denied</h1>
    <p>You do not have permission to access this page.</p>
    {% if request.user.is_authenticated %}
    <a href="{% url 'clinic_auth:staff_home' %}">Return to staff account</a>
    {% else %}
    <a href="{% url 'clinic_auth:login' %}">Go to sign in</a>
    {% endif %}
</section>
{% endblock %}
